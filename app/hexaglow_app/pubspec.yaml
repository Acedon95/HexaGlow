name: hexaglow_app
description: "Control UI for the HexaGlow LED hexagon art piece."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_colorpicker: ^1.1.0
  shared_preferences: ^2.5.5
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/hexaglow_background_asset.png

flutter_launcher_icons:
  android: true
  image_path: "assets/hexaglow_app_symbol.png"
  windows:
    generate: true
    image_path: "assets/hexaglow_app_symbol.png"
    icon_size: 256
